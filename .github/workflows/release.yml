name: Release

# Publishes to npm when a GitHub release is published (e.g. tag v0.1.0).
# Needs an NPM_TOKEN repository secret (an npm automation token).
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: |
          [ "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}" ] || { echo "Tag doesn't match package.json version"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
